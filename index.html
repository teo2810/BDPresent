<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#060914" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Cento o niente</title>
  <style>
    :root {
      --bg: #060914;
      --fg: #f4f7fb;
      --muted: #93a0b8;
      --line: rgba(255, 255, 255, 0.12);
      --glass: rgba(255, 255, 255, 0.06);
      --cyan: #22d3ee;
      --coral: #ff5a7a;
      --gold: #f5c56b;
      --mint: #3ee0b0;
      --ink: #041018;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(900px 420px at 50% -12%, rgba(34, 211, 238, 0.16), transparent 60%),
        var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    button { font: inherit; color: inherit; }
    .app {
      width: min(480px, 100%);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: calc(10px + var(--safe-top)) 16px calc(96px + var(--safe-bot));
    }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
    }
    .kicker {
      margin: 0;
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
    }
    #phaseLabel { margin: 2px 0 0; font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
    .hud-right { display: flex; align-items: center; gap: 8px; }
    .scorebox { text-align: right; }
    .scorebox strong {
      display: block;
      font-size: 30px;
      line-height: 0.9;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      font-weight: 760;
    }
    .scorebox span {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .scorebox.hot strong { color: var(--gold); }
    .scorebox.cold strong { color: var(--coral); }
    #mute {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--glass);
      display: grid;
      place-items: center;
      padding: 0;
    }
    #mute svg { width: 18px; height: 18px; display: block; }
    #stage {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .display {
      margin: 8px 0 0;
      font-size: clamp(46px, 14vw, 68px);
      line-height: 0.86;
      letter-spacing: -0.055em;
      font-weight: 800;
    }
    .display i { font-style: normal; color: var(--coral); }
    .lede { color: var(--muted); font-size: 16px; line-height: 1.45; margin: 14px 0 0; }
    .card {
      margin-top: 8px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 14px 14px 6px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .rule {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      padding: 5px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .rule:first-child { border-top: 0; }
    .n {
      width: 28px; height: 28px; border-radius: 9px;
      display: grid; place-items: center;
      background: rgba(34, 211, 238, 0.14);
      color: var(--cyan);
      font-size: 13px;
      font-weight: 750;
    }
    .rule p { margin: 0; font-size: 14px; line-height: 1.4; }
    .rule strong { font-weight: 700; }
    .cliff {
      margin-top: 6px;
      border-radius: 18px;
      padding: 8px 12px;
      background: rgba(255, 90, 122, 0.08);
      border: 1px solid rgba(255, 90, 122, 0.28);
      color: #ffd0d8;
      font-size: 13.5px;
      line-height: 1.45;
    }
    .primary, .ghost, .choice, .side, .pad, .cell, .confirm {
      border-radius: 16px;
      border: 1px solid transparent;
    }
    .primary {
      margin-top: 8px;
      min-height: 52px;
      width: 100%;
      background: var(--cyan);
      color: var(--ink);
      font-weight: 760;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    .primary:disabled { opacity: 0.4; }
    .ghost {
      margin-top: 10px;
      min-height: 48px;
      width: 100%;
      background: transparent;
      border-color: var(--line);
      color: var(--fg);
      font-weight: 650;
    }
    .qmeta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .qmeta b { color: var(--fg); font-weight: 750; }
    h2.q {
      margin: 12px 0 14px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.03em;
      font-weight: 750;
    }
    .choice {
      width: 100%;
      text-align: left;
      min-height: 52px;
      margin-bottom: 8px;
      padding: 12px 14px;
      background: var(--glass);
      border-color: var(--line);
      font-size: 16px;
      font-weight: 620;
    }
    .choice.good { background: rgba(62, 224, 176, 0.16); border-color: var(--mint); color: var(--mint); }
    .choice.bad { background: rgba(255, 90, 122, 0.12); border-color: var(--coral); color: #ffb3c0; }
    .shake { animation: shake 0.36s ease; }
    @keyframes shake {
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }
    .arena-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .timerow { display: flex; justify-content: space-between; align-items: baseline; }
    .timerow strong {
      font-size: 34px;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
    }
    .bar { height: 4px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 100%; background: var(--cyan); transform-origin: left center; }
    .arena {
      position: relative;
      flex: 1;
      min-height: 360px;
      border-radius: 28px;
      overflow: hidden;
      touch-action: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 30%),
        rgba(255,255,255,0.03);
      border: 1px solid var(--line);
    }
    .arena.hit { box-shadow: inset 0 0 0 2px var(--coral); }
    .bal {
      position: absolute;
      left: 0;
      top: 0;
      padding: 0;
      border: 0;
      background: transparent;
      touch-action: none;
    }
    .bal .body {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 72%;
      border-radius: 50% 50% 48% 48% / 42% 42% 58% 58%;
      background:
        radial-gradient(ellipse at 32% 26%, rgba(255,255,255,.95), rgba(255,255,255,0) 22%),
        radial-gradient(ellipse at 68% 72%, rgba(0,0,0,.22), transparent 46%),
        var(--c);
      box-shadow: inset -8px -12px 16px rgba(0,0,0,.2), inset 5px 6px 8px rgba(255,255,255,.4);
    }
    .bal .body::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 10px;
      height: 9px;
      margin-left: -5px;
      background: var(--c);
      filter: brightness(0.62);
      clip-path: polygon(50% 100%, 8% 0, 92% 0);
    }
    .bal .cord {
      position: absolute;
      left: 50%;
      top: 74%;
      width: 1.5px;
      height: 24%;
      margin-left: -1px;
      background: rgba(244,247,251,.7);
      transform-origin: top center;
      animation: sway 1.5s ease-in-out infinite;
    }
    .bal.popped .body { transform: scale(1.4); opacity: 0; transition: transform .12s ease, opacity .12s ease; }
    .bal.popped .cord { opacity: 0; }
    .bal.bomb .body {
      background:
        radial-gradient(ellipse at 32% 26%, rgba(255,255,255,.4), rgba(255,255,255,0) 20%),
        linear-gradient(160deg, #3a2a32, #161018 70%);
      box-shadow: inset 0 0 0 2px #ff5a7a, inset -6px -10px 12px rgba(0,0,0,.35);
    }
    .bal.bomb .body::after { background: #ff5a7a; }
    .bal.bomb .cord {
      height: 14%;
      background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
      animation: none;
    }
    @keyframes sway {
      50% { transform: rotate(7deg); }
    }
    .bridge-scene {
      position: relative;
      height: min(62dvh, 520px);
      margin-top: 8px;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, #121a2e 0%, #070b16 70%);
      border: 1px solid var(--line);
    }
    .track {
      position: absolute;
      left: 0;
      right: 0;
      top: 12px;
      bottom: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .pair {
      flex: 1 1 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .pane {
      height: 100%;
      min-height: 26px;
      padding: 0;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,.32);
      background:
        linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.05) 46%, rgba(34,211,238,.14));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 7px 0 rgba(0,0,0,.28);
    }
    .pane:disabled { opacity: 1; }
    .pane.lit {
      background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(34,211,238,.8));
      box-shadow: 0 0 16px rgba(34,211,238,.8), 0 7px 0 rgba(0,0,0,.28);
    }
    .pane.current { box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 7px 0 rgba(0,0,0,.28); }
    .pane.stood {
      background: linear-gradient(180deg, rgba(255,255,255,.4), rgba(62,224,176,.5));
    }
    .pane.shatter {
      background: rgba(255,90,122,.5);
      animation: crack .5s ease forwards;
    }
    @keyframes crack {
      50% { transform: scale(1.05); }
      100% { transform: translateY(18px) scale(.72); opacity: .15; }
    }
    .lip {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 10px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(180deg, #2a3348, #151b2a);
      box-shadow: 0 6px 0 #0a0e16;
    }
    .walker {
      position: absolute;
      z-index: 4;
      width: 18px;
      pointer-events: none;
      transition: left .22s ease, top .22s ease;
    }
    .walker i {
      display: block;
      width: 12px;
      height: 12px;
      margin: 0 auto;
      border-radius: 50%;
      background: #f4f7fb;
    }
    .walker b {
      display: block;
      width: 14px;
      height: 16px;
      margin: 1px auto 0;
      border-radius: 6px 6px 3px 3px;
      background: var(--cyan);
    }
    .walker.fall {
      transition: transform .5s ease, opacity .5s ease;
      transform: translateY(48px) rotate(18deg);
      opacity: 0;
    }
    .pads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .pad {
      min-height: 108px;
      font-weight: 760;
      letter-spacing: -0.03em;
      color: var(--ink);
      border: 0;
      opacity: 0.78;
    }
    .pad.lit { opacity: 1; transform: scale(0.98); filter: brightness(1.15); }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
    .cell {
      position: relative;
      aspect-ratio: 1;
      background:
        linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)),
        var(--glass);
      border: 1px solid var(--line);
      color: var(--cyan);
      padding: 0;
      overflow: hidden;
    }
    .cell .mess, .cell .mark { position: absolute; inset: 2px; }
    .cell svg { width: 100%; height: 100%; display: block; }
    .cell .mark { filter: drop-shadow(0 0 4px rgba(34,211,238,.9)); }
    .cell:disabled { opacity: 1; }
    .cell.on { background: rgba(34, 211, 238, 0.18); border-color: var(--cyan); }
    .cell.hitcell { background: rgba(62, 224, 176, 0.16); border-color: var(--mint); color: var(--mint); }
    .cell.misscell { background: rgba(255, 90, 122, 0.12); border-color: var(--coral); color: var(--coral); }
    .note { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 8px 0 0; }
    .count {
      margin-top: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      letter-spacing: -0.04em;
      font-size: 22px;
    }
    .break { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .break td { padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 15px; }
    .break td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 720; }
    .total-line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; }
    .total-line strong { font-size: 42px; letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
    .fail-title { color: var(--coral); }
    .win-title { color: var(--gold); }
    .gift-slot {
      margin-top: 14px;
      min-height: 180px;
      border-radius: 18px;
      border: 1px dashed rgba(245, 197, 107, 0.45);
      background: rgba(245, 197, 107, 0.06);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
      color: var(--gold);
    }
    .gift-slot img { width: 100%; height: auto; border-radius: 14px; display: block; }
    .gift-slot p { margin: 0; font-size: 16px; line-height: 1.4; }
    .fine { color: var(--muted); font-size: 12px; line-height: 1.4; margin: 8px 0 0; }
    .ticket {
      position: relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,.55), transparent 18%),
        #f6efe4;
      color: #1c140e;
      border-radius: 8px 26px 26px 8px;
      padding: 12px 14px 12px;
      box-shadow: -10px 0 0 #e4d5bd, 0 24px 44px rgba(0,0,0,.4);
    }
    .ticket::before, .ticket::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 4px 16px 16px 4px;
    }
    .ticket::before { inset: 7px; border: 1px solid rgba(154, 112, 42, .55); }
    .ticket::after { inset: 11px; border: 1px solid rgba(154, 112, 42, .28); }
    .card-sky {
      position: relative;
      height: 122px;
      border-radius: 6px 16px 8px 8px;
      overflow: hidden;
      background:
        radial-gradient(90px 50px at 50% 100%, rgba(245,197,107,.28), transparent 70%),
        linear-gradient(180deg, #2a3a66 0%, #151c33 78%);
      margin-bottom: 14px;
    }
    .bouquet { width: 100%; height: 100%; display: block; }
    .ticket-kicker {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8d642e;
      font-weight: 750;
    }
    .ticket-hello {
      margin: 4px 0 0;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      font-style: italic;
      font-size: 18px;
      letter-spacing: 0.01em;
      font-weight: 500;
      color: #8d4538;
    }
    .ticket h1 {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      font-size: clamp(46px, 13vw, 64px);
      line-height: 0.86;
      letter-spacing: -0.03em;
      font-weight: 500;
      color: #1c140e;
    }
    .ticket h1 em { font-style: italic; font-weight: 500; color: #c44762; }
    .seal-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .seal {
      width: 46px;
      height: 46px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 34% 30%, #ff9aab, #e23b5b 58%, #9b1d36);
      color: #fff8f3;
      box-shadow: inset 0 -7px 10px rgba(0,0,0,.25), 0 8px 16px rgba(160, 30, 55, .35);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }
    .seal-row p { margin: 0; color: #5c5146; font-size: 14px; line-height: 1.35; }
    .seal-row strong { display: block; color: #1c140e; font-size: 15px; font-weight: 750; }
    @media (prefers-reduced-motion: reduce) {
      .shake { animation: none; }
      .pad.lit { transition: none; }
      .mini-bal { animation: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p class="kicker">Sfida di compleanno</p>
        <p id="phaseLabel">Regole</p>
      </div>
      <div class="hud-right">
        <div class="scorebox" id="scoreBox">
          <strong id="scoreNum">0</strong>
          <span>su 100</span>
        </div>
        <button id="mute" type="button" aria-label="Disattiva audio" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 10v4h4l5 4V6L8 10H4z" fill="currentColor" stroke="none"/>
            <path d="M16 9.5a4 4 0 010 5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>
    <div id="stage"></div>
  </div>
  <script>
    const GIFT_IMAGE = "";

    const QUIZ = [
      { q: "Qual è la capitale dell'Australia?", c: ["Sydney", "Melbourne", "Canberra", "Perth"], a: 2 },
      { q: "Chi canta la canzone Thriller?", c: ["Prince", "Michael Jackson", "Stevie Wonder", "George Michael"], a: 1 },
      { q: "In quale paese si trova la Torre Eiffel?", c: ["Italia", "Spagna", "Francia", "Belgio"], a: 2 },
      { q: "Qual è il pianeta più grande del sistema solare?", c: ["Marte", "Venere", "Giove", "Mercurio"], a: 2 },
      { q: "Di che colore è un rubino?", c: ["Verde", "Rosso", "Blu", "Giallo"], a: 1 },
      { q: "In quale anno è caduto il muro di Berlino?", c: ["1979", "1985", "1989", "1991"], a: 2 },
      { q: "Secondo il modo di dire, quale animale ha la memoria corta?", c: ["Elefante", "Pesce rosso", "Gufo", "Delfino"], a: 1 },
      { q: "Quante zampe ha un ragno?", c: ["6", "8", "10", "12"], a: 1 },
      { q: "Quale metallo è liquido a temperatura ambiente?", c: ["Mercurio", "Ferro", "Rame", "Argento"], a: 0 },
      { q: "Da che parte sorge il sole?", c: ["Nord", "Sud", "Est", "Ovest"], a: 2 }
    ];

    const GLYPHS = [
      '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="11" fill="none" stroke="currentColor" stroke-width="3"/></svg>',
      '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="12" y="12" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3"/></svg>',
      '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 8 L40 40 H8 Z" fill="none" stroke="currentColor" stroke-width="3"/></svg>',
      '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 24 H40 M24 8 V40" fill="none" stroke="currentColor" stroke-width="3"/></svg>',
      '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6 L28 18 H41 L30 26 L34 40 L24 31 L14 40 L18 26 L7 18 H20 Z" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>',
      '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 30c6-14 22-14 28 0" fill="none" stroke="currentColor" stroke-width="3"/><path d="M16 30c4-8 12-8 16 0" fill="none" stroke="currentColor" stroke-width="3"/></svg>'
    ];

    const PADS = [
      { name: "Ciano", color: "#22d3ee" },
      { name: "Corallo", color: "#ff5a7a" },
      { name: "Oro", color: "#f5c56b" },
      { name: "Menta", color: "#3ee0b0" }
    ];

    const SONG = [
      { pad: 0, f: 392, ioi: 280 },
      { pad: 0, f: 392, ioi: 280 },
      { pad: 1, f: 440, ioi: 520 },
      { pad: 0, f: 392, ioi: 520 },
      { pad: 2, f: 523.25, ioi: 520 },
      { pad: 3, f: 493.88, ioi: 900 }
    ];
    const PAD_FREQ = [392, 440, 523.25, 493.88];

    function messSvg(i) {
      let n = (S.matrixSalt ^ Math.imul(i + 1, 374761393)) >>> 0;
      const rnd = () => {
        n = (Math.imul(n, 1664525) + 1013904223) >>> 0;
        return n / 4294967296;
      };
      const parts = [];
      const lines = 5 + ((rnd() * 3) | 0);
      for (let k = 0; k < lines; k++) {
        const x1 = (4 + rnd() * 40).toFixed(1);
        const y1 = (4 + rnd() * 40).toFixed(1);
        const x2 = (4 + rnd() * 40).toFixed(1);
        const y2 = (4 + rnd() * 40).toFixed(1);
        const o = (0.25 + rnd() * 0.35).toFixed(2);
        parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(244,247,251,${o})" stroke-width="${(1 + rnd()).toFixed(1)}"/>`);
      }
      for (let k = 0; k < 3; k++) {
        parts.push(`<circle cx="${(8 + rnd() * 32).toFixed(1)}" cy="${(8 + rnd() * 32).toFixed(1)}" r="${(1.2 + rnd() * 2.2).toFixed(1)}" fill="rgba(180,190,210,0.55)"/>`);
      }
      const kind = rnd();
      if (kind < 0.34) parts.push(`<rect x="14" y="14" width="16" height="16" fill="none" stroke="rgba(34,211,238,0.35)" stroke-width="1.6" transform="rotate(${(rnd() * 50).toFixed(0)} 24 24)"/>`);
      else if (kind < 0.67) parts.push(`<circle cx="24" cy="24" r="${(7 + rnd() * 6).toFixed(1)}" fill="none" stroke="rgba(255,90,122,0.35)" stroke-width="1.6"/>`);
      else parts.push(`<path d="M24 11 L36 36 H12 Z" fill="none" stroke="rgba(245,197,107,0.4)" stroke-width="1.6"/>`);
      return `<svg viewBox="0 0 48 48" aria-hidden="true">${parts.join("")}</svg>`;
    }

    function cellFace(i, showMark) {
      const mark = showMark ? `<span class="mark">${GLYPHS[S.matrixOn.indexOf(i) % GLYPHS.length]}</span>` : "";

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => {
        switch (c) {
          case "&": return "\u0026amp;";
          case "<": return "\u0026lt;";
          case ">": return "\u0026gt;";
          case '"': return "\u0026quot;";
          default: return "\u0026#39;";
        }
      });

    function maxPossible() {
      const quiz = S.quizClosed ? S.scores.quiz : (S.started ? Math.max(0, 40 - 5 * S.misses) : 40);

      const br = S.bridgeClosed ? S.scores.bridge : 15;
      const si = S.simonClosed ? S.scores.simon : 15;
      const ma = S.matrixClosed ? S.scores.matrix : 15;
      return quiz + bal + br + si + ma;
    }

    function livePoints() {
      if (!S.started) return 0;
      let n = S.quizClosed ? S.scores.quiz : Math.max(0, 40 - 5 * S.misses);
      if (S.balloonsClosed) n += S.scores.balloons;
      else if (S.screen === "balloons") n += Math.min(30, S.pops);
      n += S.scores.bridge + S.scores.simon + S.scores.matrix;
      return n;
    }

    function total() {

      if (pops) pops.textContent = String(S.pops);

    function wait(ms) {
      return new Promise((resolve) => {
        const t0 = performance.now();
        const step = (now) => {
          if (now - t0 >= ms) resolve();
          else requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    function ensureAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function tone(freq, dur, type, gain) {
      if (S.mute || !audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.value = gain || 0.05;
      o.connect(g);
      g.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      g.gain.setValueAtTime(gain || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t);
      o.stop(t + dur + 0.02);
    }

                const wanted = S.matrixOn.includes(i);
                const picked = S.matrixPick.includes(i);

                return `<div class="cell ${cls}">${glyph}</div>`;
              }).join("")}

      final() {
        const won = total() >= 100;
        const rows = [
          ["Quiz", S.scores.quiz, 40],
          ["Palloncini", S.scores.balloons, 30],

        ];

    function doomCheck() {
      if (maxPossible() < 100) {
        finish();
        return true;
      }
      return false;
    }

    function begin() {
      ensureAudio();
      S.started = true;
      S.screen = "quiz";
      paint();
    }

    function answer(i) {
      if (S.lock || S.screen !== "quiz") return;
      const item = QUIZ[S.q];
      const btn = document.querySelector(`[data-act="answer"][data-i="${i}"]`);
      if (i === item.a) {
        S.lock = true;
        btn?.classList.add("good");
        tone(880, 0.07, "sine", 0.05);
        const epoch = S.epoch;
        wait(240).then(() => {
          if (epoch !== S.epoch) return;
          S.lock = false;
          S.tried = false;
          S.q += 1;
          if (S.q >= QUIZ.length) closeQuiz();
          else paint();
        });
        return;
      }
      btn?.classList.add("bad");
      if (!S.tried) {
        S.tried = true;
        S.misses += 1;
        tone(130, 0.12, "sawtooth", 0.04);
        document.querySelector(".qcard")?.classList.add("shake");
        hud();
      } else {
        tone(110, 0.06, "sawtooth", 0.03);
      }
    }

    function closeQuiz() {
      S.quizClosed = true;
      S.scores.quiz = Math.max(0, 40 - 5 * S.misses);
      if (doomCheck()) return;
      S.readyKind = "balloons";
      S.screen = "ready";
      paint();
    }

    function goReady() {
      ensureAudio();
      if (S.readyKind === "balloons") startBalloons();
      else if (S.readyKind === "bridge") startBridge();
      else if (S.readyKind === "simon") startSimon();
      else startMatrix();
    }

    function clearBalloons() {
      balloons.forEach((b) => b.el.remove());
      balloons = [];
    }

    function spawnBalloon(y) {
      const arena = document.getElementById("arena");
      if (!arena) return;
      const bomb = Math.random() < 0.16;
      const size = bomb ? 58 + Math.random() * 18 : 34 + Math.pow(Math.random(), 1.35) * 70;
      const tall = Math.round(size * 1.34);
      const el = document.createElement("button");
      el.type = "button";
      el.className = "bal" + (bomb ? " bomb" : "");
      el.style.width = size + "px";
      el.style.height = tall + "px";
      el.innerHTML = '<span class="body"></span><span class="cord"></span>';
      el.querySelector(".cord").style.animationDuration = (1.2 + Math.random() * 0.8).toFixed(2) + "s";
      const colors = ["#ff4d6d", "#3ec6ff", "#ffd166", "#5ee0a0", "#ff8a3d"];
      el.style.setProperty("--c", bomb ? "#241820" : colors[(Math.random() * colors.length) | 0]);
      el.setAttribute("aria-label", bomb ? "Bomba" : "Palloncino");
      const b = {
        el, bomb, size, tall, alive: true,
        x: Math.random() * Math.max(8, arena.clientWidth - size),
        y: y,
        vy: (150 + Math.random() * 110) * (size < 48 ? 1.28 : 1),
        phase: Math.random() * Math.PI * 2,
        wobble: 8 + Math.random() * 14
      };
      arena.appendChild(el);
      balloons.push(b);
      el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;
    }

    function retire(b) {
      b.alive = false;
      b.el.classList.add("popped");
      const el = b.el;
      balloons = balloons.filter((x) => x !== b);
      wait(120).then(() => el.remove());
    }

    function startBalloons() {
      S.screen = "balloons";
      S.pops = 0;
      S.timeLeft = 20;
      S.running = false;
      paint();
      requestAnimationFrame(() => {
        const arena = document.getElementById("arena");
        if (!arena) return;
        clearBalloons();
        const h = arena.clientHeight || 420;
        for (let i = 0; i < 8; i++) spawnBalloon(h * (0.05 + Math.random() * 1.05));
        S.running = true;
        hud();
      });
    }

    function popBalloon(target) {
      if (!S.running) return;
      const b = balloons.find((x) => x.el === target && x.alive);
      if (!b) return;
      if (b.bomb) {
        S.timeLeft = Math.max(0, S.timeLeft - 3);
        tone(80, 0.16, "square", 0.045);
        document.getElementById("arena")?.classList.add("hit");
        wait(160).then(() => document.getElementById("arena")?.classList.remove("hit"));
        retire(b);
        hud();
        if (S.timeLeft <= 0) endBalloons();
        return;
      }
      S.pops += 1;
      tone(640 + Math.random() * 220, 0.045, "sine", 0.045);
      retire(b);
      hud();
    }

    function endBalloons() {
      if (S.balloonsClosed) return;
      S.running = false;
      S.timeLeft = Math.max(0, S.timeLeft);
      S.balloonsClosed = true;
      S.scores.balloons = Math.min(30, S.pops);
      clearBalloons();
      if (doomCheck()) return;
      S.readyKind = "bridge";
      S.screen = "ready";
      paint();
    }

    function stepBalloons(dt) {
      const arena = document.getElementById("arena");
      if (!arena) return;
      S.timeLeft -= dt;
      if (S.timeLeft <= 0) {
        S.timeLeft = 0;
        hud();
        endBalloons();
        return;
      }
      const w = arena.clientWidth;
      const h = arena.clientHeight;
      for (const b of [...balloons]) {
        if (!b.alive) continue;
        b.y -= b.vy * dt;
        b.phase += dt * 2.5;
        if (b.y < -b.tall - 12) {
          retire(b);
          continue;
        }
        const x = Math.max(0, Math.min(w - b.size, b.x + Math.sin(b.phase) * b.wobble));
        b.el.style.transform = `translate3d(${x}px, ${b.y}px, 0)`;
      }
      let guard = 0;
      while (balloons.length < 8 && guard++ < 8) spawnBalloon(h + 8 + guard * 18);
      hud();
    }

    function startBridge() {
      S.bridge = Array.from({ length: 8 }, () => (Math.random() < 0.5 ? "L" : "R"));
      S.bridgeStep = 0;
      S.bridgePhase = "preview";
      S.bridgePreviewUntil = Infinity;
      S.lock = false;
      S.screen = "bridge";
      paint();
      requestAnimationFrame(() => {
        S.bridgePreviewUntil = performance.now() + 1500;
      });
    }

    function placeWalkerOn(el) {
      const scene = document.getElementById("bridgeScene");
      const walker = document.getElementById("walker");
      if (!el || !scene || !walker) return;
      const pr = el.getBoundingClientRect();
      const sr = scene.getBoundingClientRect();
      walker.hidden = false;
      walker.style.left = (pr.left - sr.left + pr.width / 2 - 9) + "px";
      walker.style.top = (pr.top - sr.top - 26) + "px";
    }

    function chooseBridge(side) {
      if (S.bridgePhase !== "input" || S.lock) return;
      const step = S.bridgeStep;
      const ok = side === S.bridge[step];
      S.lock = true;
      const pane = document.querySelector(`.pane[data-step="${step}"][data-side="${side}"]`);
      placeWalkerOn(pane);
      if (!ok) {
        pane?.classList.add("shatter");
        document.getElementById("walker")?.classList.add("fall");
        tone(90, 0.2, "square", 0.05);
        const epoch = S.epoch;
        wait(680).then(() => {
          if (epoch !== S.epoch) return;
          S.bridgePhase = "dead";
          S.scores.bridge = 0;
          S.bridgeClosed = true;
          paint();
        });
        return;
      }
      pane?.classList.add("stood");
      tone(540, 0.05, "sine", 0.04);
      const epoch = S.epoch;
      wait(230).then(() => {
        if (epoch !== S.epoch) return;
        S.bridgeStep += 1;
        if (S.bridgeStep >= 8) {
          S.scores.bridge = 15;
          S.bridgeClosed = true;
          S.bridgePhase = "clear";
          paint();
          return;
        }
        document.querySelectorAll(".pane.current").forEach((el) => {
          el.classList.remove("current");
          el.disabled = true;
        });
        document.querySelectorAll(`.pane[data-step="${S.bridgeStep}"]`).forEach((el) => {
          el.disabled = false;
          el.classList.add("current");
        });
        const cd = document.getElementById("countDown");
        if (cd) cd.textContent = (S.bridgeStep + 1) + " / 8";
        S.lock = false;
      });
    }

    function nextFrom(name) {
      if (doomCheck()) return;
      S.readyKind = name;
      S.screen = "ready";
      S.lock = false;
      paint();
    }

    function xylo(freq, dur) {
      if (S.mute || !audioCtx) return;
      const t = audioCtx.currentTime;
      const partials = [1, 2.76, 5.4];
      const levels = [0.09, 0.035, 0.012];
      partials.forEach((m, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = freq * m;
        g.gain.setValueAtTime(levels[i], t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
      });
    }

    function startSimon() {
      S.simon = SONG.map((n) => n.pad);
      S.simonInput = 0;
      S.simonPhase = "play";
      S.lock = false;
      S.screen = "simon";
      const token = ++S.simonToken;
      paint();
      runSimon(token);
    }

    async function runSimon(token) {
      await wait(420);
      for (const note of SONG) {
        if (token !== S.simonToken || S.screen !== "simon") return;
        light(note.pad, true);
        xylo(note.f, Math.min(0.45, note.ioi / 1000));
        await wait(Math.max(80, note.ioi - 60));
        light(note.pad, false);
        await wait(60);
      }
      if (token !== S.simonToken || S.screen !== "simon") return;
      S.simonPhase = "input";
      const el = document.getElementById("simonNote");
      if (el) el.textContent = "Tocca le note, nello stesso ordine.";
    }

    function light(i, on) {
      document.querySelector(`[data-pad="${i}"]`)?.classList.toggle("lit", on);
    }

    function pressSimon(i) {
      if (S.simonPhase !== "input" || S.lock) return;
      light(i, true);
      wait(110).then(() => light(i, false));
      xylo(PAD_FREQ[i], 0.22);
      if (S.simon[S.simonInput] !== i) {
        S.lock = true;
        S.simonPhase = "dead";
        S.scores.simon = 0;
        S.simonClosed = true;
        tone(100, 0.16, "sawtooth", 0.05);
        paint();
        return;
      }
      S.simonInput += 1;
      const note = document.getElementById("simonNote");
      if (note) note.textContent = S.simonInput + " / 6";
      if (S.simonInput >= 6) {
        S.scores.simon = 15;
        S.simonClosed = true;
        S.simonPhase = "clear";
        tone(990, 0.12, "sine", 0.05);
        paint();
      }
    }

    function startMatrix() {
      const pool = [...Array(16).keys()];
      for (let i = pool.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        const tmp = pool[i];
        pool[i] = pool[j];
        pool[j] = tmp;
      }
      S.matrixOn = pool.slice(0, 6);
      S.matrixSalt = (Math.random() * 1e9) | 0;
      S.matrixPick = [];
      S.matrixPhase = "show";
      S.matrixUntil = Infinity;
      S.lock = false;
      S.screen = "matrix";
      paint();
      requestAnimationFrame(() => {
        S.matrixUntil = performance.now() + 1500;
      });
    }

    function toggleCell(i) {
      if (S.matrixPhase !== "pick") return;
      const at = S.matrixPick.indexOf(i);
      if (at >= 0) S.matrixPick.splice(at, 1);
      else if (S.matrixPick.length < 6) S.matrixPick.push(i);
      else return;
      document.querySelectorAll("[data-cell]").forEach((el) => {
        el.classList.toggle("on", S.matrixPick.includes(Number(el.getAttribute("data-cell"))));
      });
      const c = document.getElementById("pickCount");
      if (c) c.textContent = S.matrixPick.length + " / 6";
      const btn = document.getElementById("confirm");
      if (btn) btn.disabled = S.matrixPick.length !== 6;
    }

    function confirmMatrix() {
      if (S.matrixPhase !== "pick" || S.matrixPick.length !== 6) return;
      const set = new Set(S.matrixOn);
      S.matrixCorrect = S.matrixPick.filter((i) => set.has(i)).length;
      S.scores.matrix = S.matrixCorrect * 2 + (S.matrixCorrect === 6 ? 3 : 0);
      S.matrixClosed = true;
      S.matrixPhase = "done";
      tone(S.matrixCorrect === 6 ? 990 : 360, 0.1, "sine", 0.05);
      paint();
    }

    function finish() {
      S.running = false;
      S.simonToken++;
      clearBalloons();
      S.screen = "final";
      paint();
      if (total() >= 100 && !celebrated) {
        celebrated = true;
        celebrate();
      }
    }

    function celebrate() {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const run = () => {
        if (typeof window.confetti !== "function") return;
        const colors = ["#22d3ee", "#ff5a7a", "#f5c56b", "#3ee0b0", "#f4f7fb"];
        const fire = (x) => window.confetti({
          particleCount: 110,
          spread: 78,
          startVelocity: 46,
          origin: { x, y: 0.62 },
          colors,
          disableForReducedMotion: true
        });
        fire(0.5);
        const t0 = performance.now();
        let left = false;
        let right = false;
        const more = (now) => {
          const dt = now - t0;
          if (!left && dt > 380) { left = true; fire(0.18); }
          if (!right && dt > 760) { right = true; fire(0.82); }
          if (dt < 1100) requestAnimationFrame(more);
        };
        requestAnimationFrame(more);
      };
      if (typeof window.confetti === "function") run();
      else {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js";
        s.onload = run;
        document.head.appendChild(s);
      }
    }

    function hardReset() {
      celebrated = false;
      clearBalloons();
      const mute = S.mute;
      const next = fresh();
      next.mute = mute;
      next.epoch = S.epoch + 1;
      next.simonToken = S.simonToken + 1;
      Object.keys(S).forEach((k) => delete S[k]);
      Object.assign(S, next);
      paint();
    }

    document.getElementById("stage").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn || btn.disabled) return;
      const act = btn.dataset.act;
      if (act === "start") begin();
      else if (act === "answer") answer(Number(btn.dataset.i));
      else if (act === "go") goReady();
      else if (act === "side") chooseBridge(btn.dataset.side);
      else if (act === "next") nextFrom(btn.dataset.next);
      else if (act === "pad") pressSimon(Number(btn.dataset.pad));
      else if (act === "cell") toggleCell(Number(btn.dataset.cell));
      else if (act === "confirm") confirmMatrix();
      else if (act === "finish") finish();
      else if (act === "reset") hardReset();
    });

    document.getElementById("stage").addEventListener("pointerdown", (e) => {
      const bal = e.target.closest?.(".bal");
      if (!bal) return;
      e.preventDefault();
      ensureAudio();
      popBalloon(bal);
    }, { passive: false });

    document.getElementById("mute").addEventListener("click", () => {
      S.mute = !S.mute;
      const btn = document.getElementById("mute");
      btn.setAttribute("aria-pressed", String(S.mute));
      btn.setAttribute("aria-label", S.mute ? "Attiva audio" : "Disattiva audio");
      btn.innerHTML = S.mute
        ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10v4h4l5 4V6L8 10H4z" fill="currentColor" stroke="none"/><path d="M17 10l5 5M22 10l-5 5" stroke-linecap="round"/></svg>'
        : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10v4h4l5 4V6L8 10H4z" fill="currentColor" stroke="none"/><path d="M16 9.5a4 4 0 010 5" stroke-linecap="round"/></svg>';
    });

    document.addEventListener("pointerdown", () => ensureAudio(), { once: true });

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.034, (now - last) / 1000);
      last = now;
      if (S.screen === "balloons" && S.running) stepBalloons(dt);
      if (S.screen === "bridge" && S.bridgePhase === "preview") {
        if (now >= S.bridgePreviewUntil) {
          S.bridgePhase = "input";
          document.querySelectorAll(".pane.lit").forEach((el) => el.classList.remove("lit"));
          document.querySelectorAll('.pane[data-step="0"]').forEach((el) => {
            el.disabled = false;
            el.classList.add("current");
          });
          const cd = document.getElementById("countDown");
          if (cd) cd.textContent = "1 / 8";
          const hint = document.getElementById("bridgeHint");
          if (hint) hint.textContent = "Tocca la lastra su cui mettere il piede.";
          placeWalkerOn(document.getElementById("lip"));
        } else {
          const node = document.getElementById("countDown");
          if (node && S.bridgePreviewUntil < Infinity) {
            node.textContent = Math.max(0, (S.bridgePreviewUntil - now) / 1000).toFixed(1);
          }
        }
      }
      if (S.screen === "matrix" && S.matrixPhase === "show") {
        if (now >= S.matrixUntil) {
          S.matrixPhase = "pick";
          paint();
        } else {
          const node = document.getElementById("countDown");
          if (node && S.matrixUntil < Infinity) {
            node.textContent = Math.max(0, (S.matrixUntil - now) / 1000).toFixed(1);
          }
        }
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    paint();
  </script>
</body>
</html>
