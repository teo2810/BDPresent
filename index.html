<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#060914" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cento o niente" />
  <title>Cento o niente</title>
  <style>
    :root {
      --bg: #060914;
      --fg: #f4f7fb;
      --muted: #93a0b8;
      --line: rgba(255, 255, 255, 0.12);
      --glass: rgba(255, 255, 255, 0.06);
      --cyan: #22d3ee;
      --coral: #ff5a7a;
      --gold: #f5c56b;
      --mint: #3ee0b0;
      --ink: #041018;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    button { font: inherit; color: inherit; touch-action: manipulation; }
    .app {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: var(--safe-top) 16px var(--safe-bot);
      background:
        radial-gradient(900px 420px at 50% -12%, rgba(34, 211, 238, 0.16), transparent 60%),
        var(--bg);
    }
    .app.at-door { padding: 0; background: #f6efe4; }
    .app.at-door #stage,
    .app.at-door .scene,
    .app.at-door .book,
    .app.at-door .cardbox {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
    }
    .app.at-door .cardbox { aspect-ratio: auto; }
    .app.at-door .stack { left: 0; top: 0; bottom: 0; width: 7px; border-radius: 0; }
    .app.at-door .inside,
    .app.at-door .leaf-front,
    .app.at-door .leaf-back { border-radius: 0; }
    .app.at-door .inside {
      padding: calc(20px + var(--safe-top)) 18px calc(16px + var(--safe-bot)) 22px;
    }
    .app.at-door .open-hint {
      right: 16px;
      bottom: calc(18px + var(--safe-bot));
    }
    .app.at-door .dogear { bottom: var(--safe-bot); }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
    }
    .kicker {
      margin: 0;
      color: var(--cyan);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
    }
    #phaseLabel { margin: 2px 0 0; font-size: 15px; font-weight: 650; letter-spacing: -0.02em; }
    .hud-right { display: flex; align-items: center; gap: 8px; }
    .scorebox { text-align: right; }
    .scorebox strong {
      display: block;
      font-size: 30px;
      line-height: 0.9;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
      font-weight: 760;
    }
    .scorebox span {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .scorebox.hot strong { color: var(--gold); }
    .scorebox.cold strong { color: var(--coral); }
    #mute {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--glass);
      display: grid;
      place-items: center;
      padding: 0;
    }
    #mute svg { width: 18px; height: 18px; display: block; }
    #stage {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }
    .scene {
      flex: 1 0 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      animation: sceneIn .42s cubic-bezier(.22, .7, .2, 1) both;
    }
    @keyframes sceneIn {
      from { opacity: 0; transform: translate3d(28px, 0, 0); }
      to { opacity: 1; transform: none; }
    }
    .nag {
      margin: 10px 0 0;
      color: #ffd0d8;
      font-size: 14px;
      line-height: 1.4;
    }
    .doombar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 10px 10px 10px 12px;
      border-radius: 16px;
      background: rgba(255, 90, 122, 0.12);
      border: 1px solid rgba(255, 90, 122, 0.45);
    }
    .doombar[hidden] { display: none; }
    .doombar p { margin: 0; flex: 1; font-size: 13px; line-height: 1.35; color: #ffd5dc; }
    .doombar button {
      flex: none;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      border: 0;
      background: var(--coral);
      color: #fff;
      font-weight: 750;
      font-size: 14px;
    }
    .veil {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: calc(24px + var(--safe-top)) 28px calc(24px + var(--safe-bot));
      background: rgba(6, 9, 20, 0.94);
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }
    .veil[hidden] { display: none; }
    .veil.on { opacity: 1; pointer-events: auto; }
    .veil p {
      margin: 0;
      max-width: 18em;
      text-align: center;
      font-family: Georgia, Palatino, serif;
      font-style: italic;
      font-size: clamp(26px, 7vw, 34px);
      line-height: 1.25;
      color: #f6efe4;
      opacity: 0;
      transform: translateY(14px);
    }
    .veil.on p { animation: lineIn .55s .12s ease forwards; }
    @keyframes lineIn { to { opacity: 1; transform: none; } }
    .display {
      margin: 8px 0 0;
      font-size: clamp(46px, 14vw, 68px);
      line-height: 0.86;
      letter-spacing: -0.055em;
      font-weight: 800;
    }
    .display i { font-style: normal; color: var(--coral); }
    .lede { color: var(--muted); font-size: 16px; line-height: 1.45; margin: 14px 0 0; }
    .card {
      margin-top: 8px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 14px 14px 6px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .rule {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      padding: 5px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .rule:first-child { border-top: 0; }
    .n {
      width: 28px; height: 28px; border-radius: 9px;
      display: grid; place-items: center;
      background: rgba(34, 211, 238, 0.14);
      color: var(--cyan);
      font-size: 13px;
      font-weight: 750;
    }
    .rule p { margin: 0; font-size: 14px; line-height: 1.4; }
    .rule strong { font-weight: 700; }
    .cliff {
      margin-top: 6px;
      border-radius: 18px;
      padding: 8px 12px;
      background: rgba(255, 90, 122, 0.08);
      border: 1px solid rgba(255, 90, 122, 0.28);
      color: #ffd0d8;
      font-size: 13.5px;
      line-height: 1.45;
    }
    .primary, .ghost, .choice, .side, .pad, .cell, .confirm {
      border-radius: 16px;
      border: 1px solid transparent;
    }
    .primary {
      margin-top: 8px;
      min-height: 52px;
      width: 100%;
      background: var(--cyan);
      color: var(--ink);
      font-weight: 760;
      font-size: 17px;
      letter-spacing: -0.02em;
    }
    .primary:disabled { opacity: 0.4; }
    .ghost {
      margin-top: 10px;
      min-height: 48px;
      width: 100%;
      background: transparent;
      border-color: var(--line);
      color: var(--fg);
      font-weight: 650;
    }
    .qmeta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .qmeta b { color: var(--fg); font-weight: 750; }
    h2.q {
      margin: 8px 0 10px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -0.03em;
      font-weight: 750;
    }
    .choice {
      width: 100%;
      text-align: left;
      min-height: 48px;
      margin-bottom: 6px;
      padding: 12px 14px;
      background: var(--glass);
      border-color: var(--line);
      font-size: 16px;
      font-weight: 620;
    }
    .choice.good {
      background: #2fbf71;
      border-color: #187a45;
      color: #fff;
    }
    .choice.bad {
      background: #e23b5b;
      border-color: #9b1d36;
      color: #fff;
    }
    .qcard { overflow: hidden; }
    .choice, .primary, .pad, .pane, .cell {
      transition: background .16s ease, box-shadow .16s ease, border-color .16s ease, filter .12s ease;
    }
    .primary:active, .pad:active, .pane:active, .cell:active { transform: scale(0.97); }
    .choice:active { filter: brightness(0.97); }
    .shake { animation: shake 0.36s ease; }
    @keyframes shake {
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }
    .arena-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .timerow { display: flex; justify-content: space-between; align-items: baseline; }
    .timerow strong {
      font-size: 34px;
      letter-spacing: -0.05em;
      font-variant-numeric: tabular-nums;
    }
    .bar { height: 4px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 100%; background: var(--cyan); transform-origin: left center; }
    .arena {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 28px;
      overflow: hidden;
      touch-action: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 30%),
        rgba(255,255,255,0.03);
      border: 1px solid var(--line);
    }
    .arena.hit { box-shadow: inset 0 0 0 2px var(--coral); }
    .bal {
      position: absolute;
      left: 0;
      top: 0;
      padding: 0;
      border: 0;
      background: transparent;
      touch-action: none;
    }
    .bal .body {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 72%;
      border-radius: 50% 50% 46% 46% / 40% 40% 58% 58%;
      background:
        radial-gradient(ellipse at 32% 24%, rgba(255,255,255,.95), rgba(255,255,255,0) 24%),
        radial-gradient(ellipse at 70% 78%, rgba(141, 69, 56, .18), transparent 46%),
        var(--c);
      box-shadow: inset -6px -10px 14px rgba(141, 69, 56, .18), 0 8px 14px rgba(141, 69, 56, .12);
    }
    .bal .body::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 10px;
      height: 9px;
      margin-left: -5px;
      background: var(--c);
      filter: brightness(0.78);
      clip-path: polygon(50% 100%, 8% 0, 92% 0);
    }
    .bal .cord {
      position: absolute;
      left: 50%;
      top: 74%;
      width: 1.5px;
      height: 24%;
      margin-left: -1px;
      background: rgba(141, 69, 56, .55);
      transform-origin: top center;
      animation: sway 1.5s ease-in-out infinite;
    }
    .bal.popped .body { transform: scale(1.35); opacity: 0; }
    .bal.popped .cord { opacity: 0; }
    .bal.bomb .body {
      background:
        radial-gradient(ellipse at 32% 24%, rgba(255,255,255,.35), rgba(255,255,255,0) 22%),
        linear-gradient(160deg, #a33b55, #6e2033);
      box-shadow: inset 0 0 0 2px #f5c56b, 0 8px 14px rgba(141, 69, 56, .18);
    }
    .bal.bomb .body::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 42%;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      background:
        linear-gradient(#f5c56b, #f5c56b) center/14px 2px no-repeat,
        linear-gradient(#f5c56b, #f5c56b) center/2px 14px no-repeat;
      transform: rotate(45deg);
    }
    .bal.bomb .body::after { background: #f5c56b; }
    .bal.bomb .cord { height: 14%; background: #f5c56b; animation: none; }
    @keyframes sway {
      50% { transform: rotate(7deg); }
    }
    .bal svg, .bal img { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; object-fit: contain; }
    .bal.popped svg, .bal.blast svg, .bal.popped img, .bal.blast img { animation: boom .42s ease forwards; }
    @keyframes boom {
      30% { transform: scale(1.18); filter: brightness(1.35); }
      100% { transform: scale(1.55); opacity: 0; }
    }
    .bridge-scene {
      position: relative;
      height: min(52dvh, 480px);
      margin-top: 8px;
      border-radius: 24px;
      overflow: hidden;
      background:
        radial-gradient(28% 18% at 8% 12%, rgba(244, 114, 142, .45), transparent 70%),
        radial-gradient(26% 16% at 92% 14%, rgba(244, 160, 180, .5), transparent 70%),
        radial-gradient(24% 14% at 18% 78%, rgba(127, 163, 122, .35), transparent 70%),
        radial-gradient(22% 14% at 84% 76%, rgba(232, 196, 120, .4), transparent 70%),
        linear-gradient(180deg, #fbf7f0, #f4e7d6);
      border: 1px solid rgba(154, 112, 42, .4);
    }
    .span3d {
      position: absolute;
      left: 16%;
      right: 16%;
      top: 8%;
      bottom: 58px;
      display: flex;
      gap: 5px;
      transform: perspective(720px) rotateX(34deg);
      transform-origin: center bottom;
    }
    .rail {
      width: 8px;
      border-radius: 8px;
      background: linear-gradient(90deg, #8a6428, #f6e2a8 42%, #c6a15a 70%, #8a6428);
      box-shadow: 0 0 0 1px rgba(120, 82, 28, .45);
    }
    .track {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .pair {
      flex: 1 1 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .pane {
      height: 100%;
      min-height: 18px;
      padding: 0;
      border-radius: 5px;
      border: 2px solid #d7b56a;
      background:
        linear-gradient(165deg, rgba(255,255,255,.8), rgba(255,255,255,0) 46%),
        linear-gradient(180deg, rgba(186, 214, 206, .62), rgba(255,255,255,.28));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.7);
    }
    .pane:disabled { opacity: 1; }
    .pane.lit {
      background:
        linear-gradient(165deg, rgba(255,255,255,.75), rgba(255,255,255,0) 40%),
        linear-gradient(180deg, #ffe7b0, #f5c56b);
      border-color: #c44762;
      box-shadow: 0 0 10px rgba(245, 197, 107, .85);
    }
    .pane.current { box-shadow: inset 0 0 0 2px #8d4538; }
    .pane.stood {
      background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(142, 217, 180, .75));
      border-color: #1e8f52;
    }
    .pane.shatter {
      background:
        linear-gradient(118deg, transparent 46%, rgba(155, 29, 54, .9) 47% 49%, transparent 50%),
        linear-gradient(62deg, transparent 42%, rgba(155, 29, 54, .85) 43% 45%, transparent 46%),
        rgba(226, 59, 91, .55);
      animation: crack .5s ease forwards;
    }
    @keyframes crack {
      50% { transform: scale(1.04); }
      100% { transform: translateY(10px) scale(.8); opacity: .2; }
    }
    .post {
      position: absolute;
      bottom: 16px;
      width: 16px;
      height: 42px;
      border-radius: 5px;
      background: linear-gradient(#8fb089, #3f6b4e);
      box-shadow: inset 0 0 0 2px #e7c56b;
    }
    .post::before {
      content: "";
      position: absolute;
      left: -4px;
      right: -4px;
      top: -8px;
      height: 10px;
      border-radius: 3px;
      background: linear-gradient(#f6e2a8, #b8893a);
    }
    .post-l { left: 11%; }
    .post-r { right: 11%; }
    .lip {
      position: absolute;
      left: 14%;
      right: 14%;
      bottom: 14px;
      height: 10px;
      border-radius: 4px;
      background: linear-gradient(90deg, #8a6428, #f6e2a8, #8a6428);
    }
    .walker {
      position: absolute;
      z-index: 4;
      width: 18px;
      pointer-events: none;
      transition: left .22s ease, top .22s ease;
    }
    .walker i {
      display: block;
      width: 12px;
      height: 12px;
      margin: 0 auto;
      border-radius: 50%;
      background: #f5c56b;
      box-shadow: 0 0 0 2px #c44762;
    }
    .walker b {
      display: block;
      width: 14px;
      height: 16px;
      margin: 1px auto 0;
      border-radius: 7px 7px 4px 4px;
      background: #c44762;
    }
    .walker.fall {
      transition: transform .5s ease, opacity .5s ease;
      transform: translateY(48px) rotate(18deg);
      opacity: 0;
    }
    .pads { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .pad {
      min-height: 92px;
      font-weight: 760;
      letter-spacing: -0.03em;
      color: var(--ink);
      border: 0;
      opacity: 0.78;
    }
    .pad.lit { opacity: 1; transform: scale(0.98); filter: brightness(1.15); }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
    .cell {
      position: relative;
      aspect-ratio: 1;
      background:
        linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02)),
        var(--glass);
      border: 1px solid var(--line);
      color: var(--cyan);
      padding: 0;
      overflow: hidden;
    }
    .cell .mess, .cell .mark { position: absolute; inset: 2px; pointer-events: none; }
    .cell svg { width: 100%; height: 100%; display: block; pointer-events: none; }
    .cell .mark { filter: drop-shadow(0 0 3px rgba(196, 71, 98, .8)); color: #c44762; }
    .cell:disabled { opacity: 1; }
    .cell.on::after {
      content: "";
      position: absolute;
      right: 7px;
      bottom: 8px;
      width: 10px;
      height: 6px;
      border-left: 2px solid #9b1d36;
      border-bottom: 2px solid #9b1d36;
      transform: rotate(-45deg);
      pointer-events: none;
    }
    .cell.hitcell { background: rgba(62, 224, 176, 0.16); border-color: var(--mint); color: var(--mint); }
    .cell.misscell { background: rgba(255, 90, 122, 0.12); border-color: var(--coral); color: var(--coral); }
    .note { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 8px 0 0; }
    .count {
      margin-top: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      letter-spacing: -0.04em;
      font-size: 22px;
    }
    .break { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .break td { padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 15px; }
    .break td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 720; }
    .total-line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; }
    .total-line strong { font-size: 42px; letter-spacing: -0.06em; font-variant-numeric: tabular-nums; }
    .fail-title { color: var(--coral); }
    .win-title { color: var(--gold); }
    .gift-slot {
      margin-top: 14px;
      min-height: 180px;
      border-radius: 18px;
      border: 1px dashed rgba(245, 197, 107, 0.45);
      background: rgba(245, 197, 107, 0.06);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
      color: var(--gold);
    }
    .gift-slot img { width: 100%; height: auto; border-radius: 14px; display: block; }
    .gift-slot p { margin: 0; font-size: 16px; line-height: 1.4; }
    .app.at-door header { display: none; }
    .book {
      perspective: 1600px;
      perspective-origin: 18% 46%;
    }
    .cardbox {
      position: relative;
      width: 100%;
      aspect-ratio: 935 / 1015;
      transform-style: preserve-3d;
      margin-left: 10px;
    }
    .stack {
      position: absolute;
      z-index: 0;
      left: -8px;
      top: 8px;
      bottom: 8px;
      width: 10px;
      border-radius: 5px 0 0 5px;
      background: linear-gradient(90deg, #c9b89a, #e7dcc8 45%, #f4ecdf);
      box-shadow: -2px 0 0 #b7a484;
    }
    .inside {
      position: absolute;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background:
        linear-gradient(90deg, #efe2cc 0, #f7f1e6 16px),
        #f6efe4;
      color: #2a241c;
      border-radius: 0 22px 22px 0;
      padding: 18px 14px 12px 18px;
      box-shadow: 0 16px 36px rgba(0,0,0,.28), inset 12px 0 16px rgba(90, 55, 20, .08);
    }
    .inside::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(40, 24, 12, .4), rgba(40, 24, 12, .05) 46%, transparent 72%);
      opacity: 0;
    }
    .book.open .inside::after { animation: pageShade 1.2s ease forwards; }
    @keyframes pageShade {
      0% { opacity: 0; }
      18% { opacity: .35; }
      45% { opacity: 1; }
      100% { opacity: 0; }
    }
    .inside-kicker {
      margin: 0 0 6px;
      font-family: Georgia, Palatino, serif;
      font-style: italic;
      color: #8d4538;
      font-size: 22px;
    }
    .inside .rule { border-top-color: rgba(28, 20, 14, .08); }
    .inside .rule p { color: #3d342c; }
    .inside .rule strong { color: #1c140e; }
    .inside .n { background: rgba(196, 71, 98, .12); color: #c44762; }
    .inside .cliff {
      background: rgba(196, 71, 98, .08);
      border-color: rgba(196, 71, 98, .28);
      color: #7a3144;
    }
    .leaf {
      position: absolute;
      inset: 0;
      z-index: 2;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transform-origin: left center;
      transition: none;
    }
    .book.open .leaf {
      animation: turnPage 1.2s cubic-bezier(.42, .04, .18, 1) forwards;
      pointer-events: none;
    }
    @keyframes turnPage {
      0% { transform: rotateY(0deg); }
      22% { transform: rotateY(-28deg); }
      48% { transform: rotateY(-78deg); }
      70% { transform: rotateY(-128deg); }
      100% { transform: rotateY(-172deg); }
    }
    .leaf-front::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(40, 24, 12, .18), transparent 28%, rgba(255, 248, 230, .45));
      opacity: 0;
      pointer-events: none;
    }
    .book.open .leaf-front::after { animation: pageLight 1.2s ease forwards; }
    @keyframes pageLight {
      0% { opacity: 0; }
      35% { opacity: 1; }
      100% { opacity: 0; }
    }
    .leaf-front, .leaf-back {
      position: absolute;
      inset: 0;
      border-radius: 0 22px 22px 0;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .leaf-front { background: #f6efe4; box-shadow: 0 18px 40px rgba(0,0,0,.38); }
    .leaf-front img { width: 100%; height: 100%; object-fit: cover; object-position: center center; display: block; }
    .leaf-back {
      transform: rotateY(180deg);
      background: linear-gradient(90deg, #e7d8c0, #f7f1e6 22%);
      box-shadow: inset -18px 0 24px rgba(70, 40, 16, .12);
    }
    .dogear {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, transparent 49%, rgba(255, 248, 240, .92) 50%);
      filter: drop-shadow(-2px -2px 2px rgba(0,0,0,.12));
    }
    .open-hint {
      position: absolute;
      right: 12px;
      bottom: 16px;
      background: rgba(28, 20, 14, .55);
      color: #fff8f3;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }
    @media (prefers-reduced-motion: reduce) {
      .leaf, .inside::after, .leaf-front::after { transition: none; animation: none; }
    }
    .book.open .leaf { transform: rotateY(-172deg); }
    .ticket {
      position: relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,.55), transparent 18%),
        #f6efe4;
      color: #1c140e;
      border-radius: 8px 26px 26px 8px;
      padding: 12px 14px 12px;
      box-shadow: -10px 0 0 #e4d5bd, 0 24px 44px rgba(0,0,0,.4);
    }
    .ticket::before, .ticket::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 4px 16px 16px 4px;
    }
    .ticket::before { inset: 7px; border: 1px solid rgba(154, 112, 42, .55); }
    .ticket::after { inset: 11px; border: 1px solid rgba(154, 112, 42, .28); }
    .card-sky {
      position: relative;
      height: 122px;
      border-radius: 6px 16px 8px 8px;
      overflow: hidden;

        linear-gradient(180deg, #2a3a66 0%, #151c33 78%);
      margin-bottom: 14px;
    }
    .bouquet { width: 100%; height: 100%; display: block; }
    .ticket-kicker {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8d642e;
      font-weight: 750;
    }
    .ticket-hello {
      margin: 4px 0 0;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      font-style: italic;
      font-size: 18px;
      letter-spacing: 0.01em;
      font-weight: 500;
      color: #8d4538;
    }
    .ticket h1 {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      font-size: clamp(46px, 13vw, 64px);
      line-height: 0.86;
      letter-spacing: -0.03em;
      font-weight: 500;
      color: #1c140e;
    }
    .ticket h1 em { font-style: italic; font-weight: 500; color: #c44762; }
    .seal-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .seal {
      width: 46px;
      height: 46px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 34% 30%, #ff9aab, #e23b5b 58%, #9b1d36);
      color: #fff8f3;
      box-shadow: inset 0 -7px 10px rgba(0,0,0,.25), 0 8px 16px rgba(160, 30, 55, .35);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }
    .seal-row p { margin: 0; color: #5c5146; font-size: 14px; line-height: 1.35; }
    .seal-row strong { display: block; color: #1c140e; font-size: 15px; font-weight: 750; }
    @media (prefers-reduced-motion: reduce) {
      .scene, .veil, .veil p, .shake { animation: none; transition: none; }
      .pad.lit { transition: none; }
      .mini-bal { animation: none; }
    }

      .choice { min-height: 46px; margin-bottom: 6px; }
    }
    .app { position: relative; }
    .app:not(.at-door) {
      background:

      font-style: italic;
      font-weight: 500;

      background: #c44762;

      background: rgba(255, 252, 247, .9);
      color: #2a241c;
      border-color: rgba(154, 112, 42, .35);
    }

    .app:not(.at-door) .arena {

        #f7f0e4;
      border-color: rgba(154, 112, 42, .35);
    }

    .app:not(.at-door) .pads,
    .app:not(.at-door) .grid4 {
      border-radius: 22px;
    }
    .app:not(.at-door) .bridge-scene {
      border-color: rgba(154, 112, 42, .4);
      box-shadow: 0 12px 28px rgba(80, 40, 20, .12);
    }
    .app:not(.at-door) .cell {
      background: rgba(255, 252, 247, .9);
      border-color: rgba(154, 112, 42, .35);
      color: #8d4538;
    }
    .app:not(.at-door) .cell.hitcell { background: #d9f5e6; border-color: #1e8f52; color: #145c34; }
    .app:not(.at-door) .cell.misscell { background: #f8d0d8; border-color: #e23b5b; color: #9b1d36; }
    .app:not(.at-door) .cell.on {
      background: #f7c2d0;
      border-color: #c44762;
      box-shadow: inset 0 0 0 3px #c44762;
    }
    .app:not(.at-door) .choice.good {
      background: #2fbf71;
      border-color: #187a45;
      color: #fff;
    }
    .app:not(.at-door) .choice.bad {
      background: #e23b5b;
      border-color: #9b1d36;
      color: #fff;
    }
    .app:not(.at-door) .total-line strong { color: #c44762; }
    .veil { background: rgba(244, 236, 223, .96); }
    .veil p { color: #8d4538; }
    .scene:has(.fit-screen) {
      height: 100%;
      max-height: 100%;
      overflow: hidden;
    }
    .fit-screen {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .fit-screen h2.q { font-size: 20px; margin: 2px 0 4px; }
    .fit-screen .grid4 {
      flex: 1 1 auto;
      min-height: 0;
      margin-top: 6px;
      grid-template-rows: repeat(4, minmax(0, 1fr));
    }
    .fit-screen .cell { aspect-ratio: auto; height: 100%; }
    .fit-screen .note { margin-top: 6px; }
    .fit-screen .primary { flex: none; margin-top: 6px; min-height: 46px; }
    .bridge-scene {
      height: min(62dvh, 580px);
      width: auto;
      max-width: 100%;
      aspect-ratio: 572 / 1024;
      margin: 4px auto 0;
      background: #f6efe4;
    }
    .bridge-art { width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none; }
    .bridge-scene .pane {
      position: absolute;
      min-height: 0;
      height: auto;
      border: 0;
      border-radius: 3px;
      background: transparent;
      box-shadow: none;
      padding: 0;
    }
    .bridge-scene .pane.lit {
      background: rgba(245, 197, 107, .5);
      box-shadow: inset 0 0 0 2px #c44762, 0 0 10px rgba(245, 197, 107, .85);
    }
    .bridge-scene .pane.current { box-shadow: inset 0 0 0 2px rgba(141, 69, 56, .9); background: rgba(255,255,255,.16); }
    .bridge-scene .pane.stood { background: rgba(47, 191, 113, .38); box-shadow: inset 0 0 0 2px #1e8f52; }
    .bridge-scene .pane.shatter { background: rgba(226, 59, 91, .55); }

    function messSvg(i) {
      let n = (S.matrixSalt ^ Math.imul(i + 1, 374761393)) >>> 0;
      const rnd = () => {
        n = (Math.imul(n, 1664525) + 1013904223) >>> 0;
        return n / 4294967296;
      };
      const parts = [];
      const lines = 5 + ((rnd() * 3) | 0);
      for (let k = 0; k < lines; k++) {
        const x1 = (4 + rnd() * 40).toFixed(1);
        const y1 = (4 + rnd() * 40).toFixed(1);
        const x2 = (4 + rnd() * 40).toFixed(1);
        const y2 = (4 + rnd() * 40).toFixed(1);
        const o = (0.25 + rnd() * 0.35).toFixed(2);
        parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(141,100,46,${o})" stroke-width="${(1 + rnd()).toFixed(1)}"/>`);
      }
      for (let k = 0; k < 3; k++) {
        parts.push(`<circle cx="${(8 + rnd() * 32).toFixed(1)}" cy="${(8 + rnd() * 32).toFixed(1)}" r="${(1.2 + rnd() * 2.2).toFixed(1)}" fill="rgba(196,71,98,0.35)"/>`);
      }
      const kind = rnd();
      if (kind < 0.34) parts.push(`<rect x="14" y="14" width="16" height="16" fill="none" stroke="rgba(34,211,238,0.35)" stroke-width="1.6" transform="rotate(${(rnd() * 50).toFixed(0)} 24 24)"/>`);
      else if (kind < 0.67) parts.push(`<circle cx="24" cy="24" r="${(7 + rnd() * 6).toFixed(1)}" fill="none" stroke="rgba(255,90,122,0.35)" stroke-width="1.6"/>`);
      else parts.push(`<path d="M24 11 L36 36 H12 Z" fill="none" stroke="rgba(245,197,107,0.4)" stroke-width="1.6"/>`);
      return `<svg viewBox="0 0 48 48" aria-hidden="true">${parts.join("")}</svg>`;
    }

    function cellFace(i, showMark) {
      const mark = showMark ? `<span class="mark">${GLYPHS[S.matrixOn.indexOf(i) % GLYPHS.length]}</span>` : "";
      return `<span class="mess">${messSvg(i)}</span>${mark}`;
    }

    };

    const S = fresh();
    let balloons = [];
    let audioCtx = null;
    let celebrated = false;

    function fresh() {
      return {
        screen: "welcome",
        started: false,
        cardOpen: false,
        misses: 0,
        q: 0,
        tried: false,
        lock: false,
        epoch: 0,
        pops: 0,
        timeLeft: 20,
        running: false,
        quizClosed: false,
        balloonsClosed: false,
        bridgeClosed: false,
        simonClosed: false,
        matrixClosed: false,
        scores: { quiz: 0, balloons: 0, bridge: 0, simon: 0, matrix: 0 },
        readyKind: "balloons",
        recapKind: "quiz",
        blasting: false,
        bridge: [],
        bridgeStep: 0,
        bridgePhase: "preview",
        bridgePreviewUntil: Infinity,
        simon: [],
        simonPhase: "play",
        simonInput: 0,
        simonToken: 0,
        matrixOn: [],
        matrixPick: [],
        matrixPhase: "show",
        matrixUntil: Infinity,
        matrixCorrect: 0,
        mute: false
      };
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => {
        switch (c) {
          case "&": return "\u0026amp;";
          case "<": return "\u0026lt;";
          case ">": return "\u0026gt;";
          case '"': return "\u0026quot;";
          default: return "\u0026#39;";
        }
      });
    }

    function maxPossible() {
      const quiz = S.quizClosed ? S.scores.quiz : (S.started ? Math.max(0, 40 - 5 * S.misses) : 40);
      const bal = S.balloonsClosed ? S.scores.balloons : 30;
      const br = S.bridgeClosed ? S.scores.bridge : 15;
      const si = S.simonClosed ? S.scores.simon : 15;
      const ma = S.matrixClosed ? S.scores.matrix : 15;
      return quiz + bal + br + si + ma;
    }

    function livePoints() {
      if (!S.started) return 0;
      let n = S.quizClosed ? S.scores.quiz : Math.max(0, 40 - 5 * S.misses);
      if (S.balloonsClosed) n += S.scores.balloons;
      else if (S.screen === "balloons") n += Math.min(30, S.pops);
      n += S.scores.bridge + S.scores.simon + S.scores.matrix;
      return n;
    }

    function total() {
      return S.scores.quiz + S.scores.balloons + S.scores.bridge + S.scores.simon + S.scores.matrix;
    }

    function hud() {
      const n = S.screen === "final" ? total() : livePoints();
      const num = document.getElementById("scoreNum");
      const box = document.getElementById("scoreBox");
      num.textContent = String(n);
      box.classList.toggle("hot", n >= WIN);
      box.classList.toggle("cold", S.started && maxPossible() < WIN);
      const unit = document.querySelector("#scoreBox span");
      if (unit) unit.textContent = "min " + WIN;
      document.querySelector(".app").classList.toggle("at-door", S.screen === "welcome");
      const doom = document.getElementById("doombar");
      if (doom) doom.hidden = !(S.started && S.screen !== "welcome" && S.screen !== "final" && maxPossible() < WIN);
      const time = document.getElementById("timeNum");
      if (time) time.textContent = S.timeLeft.toFixed(1);
      const bar = document.getElementById("timeBar");
      if (bar) bar.style.transform = `scaleX(${Math.max(0, S.timeLeft / 20)})`;
      const pops = document.getElementById("popNum");
      if (pops) pops.textContent = String(S.pops);
    }

    function wait(ms) {
      return new Promise((resolve) => {
        const t0 = performance.now();
        const step = (now) => {
          if (now - t0 >= ms) resolve();
          else requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    function ensureAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function tone(freq, dur, type, gain) {
      if (S.mute || !audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.value = gain || 0.05;
      o.connect(g);
      g.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      g.gain.setValueAtTime(gain || 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t);
      o.stop(t + dur + 0.02);
    }

    function paint() {
      const el = document.getElementById("stage");
      el.innerHTML = `<div class="scene">${views[S.screen]()}</div>`;
      hud();

      },
      quiz() {
        const item = QUIZ[S.q];
        const quizNow = Math.max(0, 40 - 5 * S.misses);
        return `
          <div class="qcard">
            <div class="qmeta"><span>Domanda ${S.q + 1} / 10</span><span>Quiz <b>${quizNow}</b> / 40</span></div>
            <h2 class="q">${esc(item.q)}</h2>
            ${item.c.map((label, i) => `<button class="choice" type="button" data-act="answer" data-i="${i}">${esc(label)}</button>`).join("")}
            <p class="note">${S.tried ? "Primo tentativo bruciato. −5 già contati. Sotto 98 il regalo non si apre." : (S.q % 3 === 2 ? NAGS[S.q % NAGS.length] : "Il primo tocco è quello che conta.")}</p>
          </div>
        `;
      },
      ready() {
        const r = READY[S.readyKind];
        return `
          <p class="kicker">${esc(r.kicker)}</p>
          <h2 class="q">${esc(r.title)}</h2>
          <p class="lede">${esc(r.body)}</p>
          <p class="nag">${esc(NAGS[["balloons", "bridge", "simon", "matrix"].indexOf(S.readyKind)] || NAGS[0])}</p>
          <button class="primary" type="button" data-act="go">${esc(r.go)}</button>
        `;
      },
      balloons() {
        return `
          <div class="arena-wrap">
            <div class="timerow">
              <strong id="timeNum">${S.timeLeft.toFixed(1)}</strong>
              <span class="note" style="margin:0">scoppi <b id="popNum">${S.pops}</b></span>
            </div>
            <div class="bar"><i id="timeBar"></i></div>
            <div class="arena" id="arena"></div>
          </div>
        `;
      },
      bridge() {
        if (S.bridgePhase === "dead" || S.bridgePhase === "clear") {
          const won = S.bridgePhase === "clear";
          return `
            <h2 class="q ${won ? "" : "fail-title"}">${won ? "Ponte attraversato" : "Il vetro cede"}</h2>
            <p class="lede">${won ? "Quindici punti. Sei dall'altra parte." : "Passo " + (S.bridgeStep + 1) + " sbagliato. La prova vale 0."}</p>
            <button class="primary" type="button" data-act="next" data-next="simon">Avanti</button>
          `;
        }
        const preview = S.bridgePhase === "preview";
        const rows = [];
        for (let i = 7; i >= 0; i--) rows.push(i);
        return `
          <div class="qmeta"><span>${preview ? "Memorizza il ponte" : "Attraversa"}</span><span id="countDown">${preview ? "1.5" : (S.bridgeStep + 1) + " / 8"}</span></div>
          <div class="bridge-scene" id="bridgeScene">
            <img class="bridge-art" alt="" src="${BRIDGE_ART}">
            ${rows.map((i) => {
              const side = S.bridge[i];
              const active = !preview && i === S.bridgeStep;
              const box = (dir) => {
                const t = i / 7;
                const top = 57 - t * 12;
                const height = 3.2 - t * 1.4;
                const span = 24 - t * 12;
                const gap = 1.6;
                const paneW = (span - gap) / 2;
                const left = 50 - span / 2 + (dir === "R" ? paneW + gap : 0);
                const lit = preview && side === dir ? " lit" : "";
                const current = active ? " current" : "";
                return `<button class="pane${lit}${current}" type="button" data-act="side" data-side="${dir}" data-step="${i}" ${active ? "" : "disabled"} style="left:${left.toFixed(2)}%;top:${top.toFixed(2)}%;width:${paneW.toFixed(2)}%;height:${height.toFixed(2)}%"></button>`;
              };
              return box("L") + box("R");
            }).join("")}
            <div class="walker" id="walker" hidden><i></i><b></b></div>
          </div>
          <p class="note" id="bridgeHint">${preview ? "Il vetro sicuro è acceso. Poi si spegne." : "Tocca la lastra su cui mettere il piede."}</p>
        `;
      },
      simon() {
        if (S.simonPhase === "dead") {
          return `
            <h2 class="q fail-title">Sequenza spezzata</h2>
            <p class="lede">Un colore fuori posto. La prova vale 0.</p>
            <button class="primary" type="button" data-act="next" data-next="matrix">Avanti</button>
          `;
        }
        if (S.simonPhase === "clear") {
          return `
            <h2 class="q">Sequenza chiusa</h2>
            <p class="lede">Quindici punti. Memoria in ordine.</p>
            <button class="primary" type="button" data-act="next" data-next="matrix">Avanti</button>
          `;
        }
        return `
          <div class="qmeta"><span>Xilofono</span><span>Tanti auguri</span></div>
          <h2 class="q">Ripeti le note</h2>
          <p class="note" id="simonNote">${S.simonPhase === "play" ? "Ascolta. Non toccare ancora." : "Tocca le note, nello stesso ordine."}</p>
          <div class="pads">
            ${PADS.map((p, i) => `<button class="pad" type="button" data-act="pad" data-pad="${i}" style="background:${p.color}">${p.name}</button>`).join("")}
          </div>
        `;
      },
      matrix() {
        if (S.matrixPhase === "done") {
          return `
            <div class="fit-screen">
            <h2 class="q">Griglia chiusa</h2>
            <p class="lede">${S.matrixCorrect} simboli giusti su 6. Vale ${S.scores.matrix} punti.</p>
            <div class="grid4">
              ${Array.from({ length: 16 }, (_, i) => {
                const wanted = S.matrixOn.includes(i);
                const picked = S.matrixPick.includes(i);
                const cls = wanted && picked ? "hitcell" : picked && !wanted ? "misscell" : wanted ? "hitcell" : "";
                const glyph = cellFace(i, wanted);
                return `<div class="cell ${cls}">${glyph}</div>`;
              }).join("")}
            </div>
            <button class="primary" type="button" data-act="finish">Vai al verdetto</button>
            </div>
          `;
        }
        const show = S.matrixPhase === "show";
        return `
          <div class="fit-screen">
          <div class="qmeta"><span>${show ? "Memorizza" : "Ritrova"}</span><span id="${show ? "countDown" : "pickCount"}">${show ? "1.5" : S.matrixPick.length + " / 6"}</span></div>
          <h2 class="q">${show ? "Quali si accendono?" : "Ritrova le sei"}</h2>
          <div class="grid4">
            ${Array.from({ length: 16 }, (_, i) => {
              const on = S.matrixOn.includes(i);
              const picked = S.matrixPick.includes(i);
              return `<button class="cell${picked ? " on" : ""}" type="button" data-act="cell" data-cell="${i}">${cellFace(i, show && on)}</button>`;
            }).join("")}
          </div>
          ${show ? `<p class="note">I simboli si spengono. Poi tocca le sei.</p>` : `<button class="primary" id="confirm" type="button" data-act="confirm" ${S.matrixPick.length === 6 ? "" : "disabled"}>Conferma le sei</button>`}
          </div>
        `;
      },
      recap() {
        const kind = S.recapKind;
        const maxes = { quiz: 40, balloons: 30, bridge: 15, simon: 15, matrix: 15 };
        const order = ["quiz", "balloons", "bridge", "simon", "matrix"];
        const got = S.scores[kind] || 0;
        const max = maxes[kind];
        const left = order.slice(order.indexOf(kind) + 1).reduce((sum, key) => sum + maxes[key], 0);
        const sum = total();
        const ceiling = sum + left;
        const heads = {
          quiz: ["Fine del quiz", "Le domande sono chiuse"],
          balloons: ["Fine dei palloncini", "Il tempo è scaduto"],
          bridge: ["Fine del ponte", got ? "Il ponte è alle spalle" : "Il vetro ha ceduto"],
          simon: ["Fine dello xilofono", got ? "La frase è completa" : "Una nota è caduta"],
          matrix: ["Fine della griglia", "Le caselle sono chiuse"]
        };
        const [kicker, title] = heads[kind];
        const detail = kind === "matrix"
          ? `Simboli giusti: ${S.matrixCorrect} su 6. La prova vale ${got} su ${max}.`
          : `Questa prova: ${got} su ${max}.`;
        const warn = ceiling < WIN
          ? `Anche il resto perfetto arriva a ${ceiling}. Sotto ${WIN} il regalo non si apre.`
          : `Sei a ${sum}. Il regalo si apre solo da ${WIN} in su.`;
        return `
          <p class="kicker">${kicker}</p>
          <h2 class="q">${title}</h2>
          <p class="lede">${detail}</p>
          <div class="total-line"><span>Totale</span><strong>${sum}</strong></div>
          <p class="nag">${warn}</p>
          <button class="primary" type="button" data-act="continue">${kind === "matrix" ? "Vai al verdetto" : "Alla prossima prova"}</button>
        `;
      },
      final() {
        const won = total() >= WIN;
        const rows = [
          ["Quiz", S.scores.quiz, 40],
          ["Palloncini", S.scores.balloons, 30],
          ["Ponte", S.scores.bridge, 15],
          ["Colori", S.scores.simon, 15],
          ["Griglia", S.scores.matrix, 15]
        ];
        return `
          <p class="kicker">${won ? "Sbloccato" : "Game over"}</p>
          <h2 class="q ${won ? "win-title" : "fail-title"}">${won ? "Il regalo è tuo" : "Spiace, niente regalo!"}</h2>
          <p class="lede">${won ? "Da 98 in su il regalo si apre. Ci sei." : "Sotto 98 non basta. Niente regalo, questa volta. Si ricomincia da zero."}</p>
          <table class="break">
            ${rows.map(([name, val, max]) => `<tr><td>${name}</td><td>${val} / ${max}</td></tr>`).join("")}
          </table>
          <div class="total-line"><span>Totale</span><strong>${total()}</strong></div>
          ${won ? (GIFT_IMAGE
            ? `<div class="gift-slot"><img src="${GIFT_IMAGE}" alt="Regalo per Marta"></div>`
            : `<div class="gift-slot"><p>Buon compleanno, Marta.</p></div>`)
          : `<button class="primary" type="button" data-act="reset">Ricomincia da capo</button>`}
        `;
      }
    };

    function begin() {
      ensureAudio();
      S.started = true;
      S.screen = "quiz";
      paint();
    }

    function answer(i) {
      if (S.lock || S.screen !== "quiz") return;
      const item = QUIZ[S.q];
      const btn = document.querySelector(`[data-act="answer"][data-i="${i}"]`);
      if (i === item.a) {
        S.lock = true;
        btn?.classList.add("good");
        document.querySelectorAll(".choice").forEach((el) => { el.disabled = true; });
        tone(880, 0.07, "sine", 0.05);
        const epoch = S.epoch;
        wait(720).then(() => {
          if (epoch !== S.epoch) return;
          S.lock = false;
          S.tried = false;
          S.q += 1;
          if (S.q >= QUIZ.length) closeQuiz();
          else paint();
        });
        return;
      }
      btn?.classList.add("bad");
      S.lock = true;
      document.querySelectorAll(".choice").forEach((el) => { el.disabled = true; });
      const epoch = S.epoch;
      wait(560).then(() => {
        if (epoch !== S.epoch) return;
        S.lock = false;
        document.querySelectorAll(".choice").forEach((el) => {
          if (!el.classList.contains("bad")) el.disabled = false;
        });
      });
      if (!S.tried) {
        S.tried = true;
        S.misses += 1;
        tone(130, 0.12, "sawtooth", 0.04);
        document.querySelector(".qcard")?.classList.add("shake");
        const note = document.querySelector(".qcard .note");
        if (note) note.textContent = "−5. Il quiz vale " + Math.max(0, 40 - 5 * S.misses) + ". Sotto 98, niente premio.";
        hud();
      } else {
        tone(110, 0.06, "sawtooth", 0.03);
      }
    }

    function closeQuiz() {
      S.quizClosed = true;
      S.scores.quiz = Math.max(0, 40 - 5 * S.misses);
      showRecap("quiz");
    }

    function goReady() {
      ensureAudio();
      if (S.readyKind === "balloons") startBalloons();
      else if (S.readyKind === "bridge") startBridge();
      else if (S.readyKind === "simon") startSimon();
      else startMatrix();
    }

    function clearBalloons() {
      balloons.forEach((b) => b.el.remove());
      balloons = [];
    }

    function spawnBalloon(y) {
      const arena = document.getElementById("arena");
      if (!arena) return;
      const bomb = Math.random() < 0.16;
      const kind = bomb
        ? ["pinkbomb", "pinkbomb2", "cluster"][(Math.random() * 3) | 0]
        : ["sage", "teal", "filigree", "drop", "sageflower", "mini", "gold", "goldclock"][(Math.random() * 8) | 0];
      const size = (bomb ? 78 : 64) + Math.random() * 28;
      const tall = Math.round(size * 1.28);
      const el = document.createElement("button");
      el.type = "button";
      el.className = "bal" + (bomb ? " bomb" : "");
      el.style.width = size + "px";
      el.style.height = tall + "px";
      el.innerHTML = `<img alt="" src="${SPRITES[kind]}">`;
      el.setAttribute("aria-label", bomb ? "Bomba" : "Palloncino");
      const b = {
        el, bomb, size, tall, alive: true,
        x: Math.random() * Math.max(8, arena.clientWidth - size),
        y: y,
        vy: (150 + Math.random() * 110) * (size < 48 ? 1.28 : 1),
        phase: Math.random() * Math.PI * 2,
        wobble: 8 + Math.random() * 14
      };
      arena.appendChild(el);
      balloons.push(b);
      el.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;
    }

    function retire(b) {
      b.alive = false;
      b.el.classList.add("popped");
      const el = b.el;
      balloons = balloons.filter((x) => x !== b);
      wait(420).then(() => el.remove());
    }

    function blastAll() {
      if (S.blasting || !S.running) return;
      S.blasting = true;
      S.timeLeft = Math.max(0, S.timeLeft - 4);
      tone(70, 0.22, "square", 0.05);
      document.getElementById("arena")?.classList.add("hit");
      const list = balloons.filter((b) => b.alive);
      list.forEach((b, i) => {
        setTimeout(() => {
          b.alive = false;
          b.el.classList.add("blast");
        }, i * 70);
      });
      const epoch = S.epoch;
      wait(list.length * 70 + 460).then(() => {
        if (epoch !== S.epoch) return;
        list.forEach((b) => b.el.remove());
        balloons = balloons.filter((b) => b.alive && b.el.isConnected);
        document.getElementById("arena")?.classList.remove("hit");
        S.blasting = false;
        hud();
        if (S.timeLeft <= 0) endBalloons();
      });
    }

    function startBalloons() {
      S.screen = "balloons";
      S.pops = 0;
      S.timeLeft = 20;
      S.running = false;
      paint();
      requestAnimationFrame(() => {
        const arena = document.getElementById("arena");
        if (!arena) return;
        clearBalloons();
        const h = arena.clientHeight || 420;
        for (let i = 0; i < 8; i++) spawnBalloon(h * (0.05 + Math.random() * 1.05));
        S.running = true;
        hud();
      });
    }

    function popBalloon(target) {
      if (!S.running) return;
      const b = balloons.find((x) => x.el === target && x.alive);
      if (!b) return;
      if (b.bomb) {
        blastAll();
        return;
      }
      S.pops += 1;
      tone(640 + Math.random() * 220, 0.045, "sine", 0.045);
      retire(b);
      hud();
    }

    function endBalloons() {
      if (S.balloonsClosed) return;
      S.running = false;
      S.blasting = false;
      S.timeLeft = Math.max(0, S.timeLeft);
      S.balloonsClosed = true;
      S.scores.balloons = Math.min(30, S.pops);
      clearBalloons();
      showRecap("balloons");
    }

    function stepBalloons(dt) {
      const arena = document.getElementById("arena");
      if (!arena) return;
      if (S.blasting) {
        S.timeLeft = Math.max(0, S.timeLeft - dt);
        hud();
        return;
      }
      S.timeLeft -= dt;
      if (S.timeLeft <= 0) {
        S.timeLeft = 0;
        hud();
        endBalloons();
        return;
      }
      const w = arena.clientWidth;
      const h = arena.clientHeight;
      for (const b of [...balloons]) {
        if (!b.alive) continue;
        b.y -= b.vy * dt;
        b.phase += dt * 2.5;
        if (b.y < -b.tall - 12) {
          retire(b);
          continue;
        }
        const x = Math.max(0, Math.min(w - b.size, b.x + Math.sin(b.phase) * b.wobble));
        b.el.style.transform = `translate3d(${x}px, ${b.y}px, 0)`;
      }
      let guard = 0;
      while (balloons.length < 8 && guard++ < 8) spawnBalloon(h + 8 + guard * 18);
      hud();
    }

    function startBridge() {
      S.bridge = Array.from({ length: 8 }, () => (Math.random() < 0.5 ? "L" : "R"));
      S.bridgeStep = 0;
      S.bridgePhase = "preview";
      S.bridgePreviewUntil = Infinity;
      S.lock = false;
      S.screen = "bridge";
      paint();
      requestAnimationFrame(() => {
        S.bridgePreviewUntil = performance.now() + 1500;
      });
    }

    function placeWalkerOn(el) {
      const scene = document.getElementById("bridgeScene");
      const walker = document.getElementById("walker");
      if (!el || !scene || !walker) return;
      const pr = el.getBoundingClientRect();
      const sr = scene.getBoundingClientRect();
      walker.hidden = false;
      walker.style.left = (pr.left - sr.left + pr.width / 2 - 9) + "px";
      walker.style.top = (pr.top - sr.top - 26) + "px";
    }

    function chooseBridge(side) {
      if (S.bridgePhase !== "input" || S.lock) return;
      const step = S.bridgeStep;
      const ok = side === S.bridge[step];
      S.lock = true;
      const pane = document.querySelector(`.pane[data-step="${step}"][data-side="${side}"]`);
      placeWalkerOn(pane);
      if (!ok) {
        pane?.classList.add("shatter");
        document.getElementById("walker")?.classList.add("fall");
        tone(90, 0.2, "square", 0.05);
        const epoch = S.epoch;
        wait(680).then(() => {
          if (epoch !== S.epoch) return;
          S.bridgePhase = "dead";
          S.scores.bridge = 0;
          S.bridgeClosed = true;
          showRecap("bridge");
        });
        return;
      }
      pane?.classList.add("stood");
      tone(540, 0.05, "sine", 0.04);
      const epoch = S.epoch;
      wait(230).then(() => {
        if (epoch !== S.epoch) return;
        S.bridgeStep += 1;
        if (S.bridgeStep >= 8) {
          S.scores.bridge = 15;
          S.bridgeClosed = true;
          S.bridgePhase = "clear";
          showRecap("bridge");
          return;
        }
        document.querySelectorAll(".pane.current").forEach((el) => {
          el.classList.remove("current");
          el.disabled = true;
        });
        document.querySelectorAll(`.pane[data-step="${S.bridgeStep}"]`).forEach((el) => {
          el.disabled = false;
          el.classList.add("current");
        });
        const cd = document.getElementById("countDown");
        if (cd) cd.textContent = (S.bridgeStep + 1) + " / 8";
        S.lock = false;
      });
    }

    function nextFrom(name) {
      S.readyKind = name;
      S.screen = "ready";
      S.lock = false;
      paint();
    }

    function xylo(freq, dur) {
      if (S.mute || !audioCtx) return;
      const t = audioCtx.currentTime;
      const partials = [1, 2.76, 5.4];
      const levels = [0.09, 0.035, 0.012];
      partials.forEach((m, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = "sine";
        o.frequency.value = freq * m;
        g.gain.setValueAtTime(levels[i], t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
      });
    }

    function startSimon() {
      S.simon = SONG.map((n) => n.pad);
      S.simonInput = 0;
      S.simonPhase = "play";
      S.lock = false;
      S.screen = "simon";
      const token = ++S.simonToken;
      paint();
      runSimon(token);
    }

    async function runSimon(token) {
      await wait(420);
      for (const note of SONG) {
        if (token !== S.simonToken || S.screen !== "simon") return;
        light(note.pad, true);
        xylo(note.f, Math.min(0.45, note.ioi / 1000));
        await wait(Math.max(80, note.ioi - 60));
        light(note.pad, false);
        await wait(60);
      }
      if (token !== S.simonToken || S.screen !== "simon") return;
      S.simonPhase = "input";
      const el = document.getElementById("simonNote");
      if (el) el.textContent = "Tocca le note, nello stesso ordine.";
    }

    function light(i, on) {
      document.querySelector(`[data-pad="${i}"]`)?.classList.toggle("lit", on);
    }

    function pressSimon(i) {
      if (S.simonPhase !== "input" || S.lock) return;
      light(i, true);
      wait(110).then(() => light(i, false));
      xylo(PAD_FREQ[i], 0.22);
      if (S.simon[S.simonInput] !== i) {
        S.lock = true;
        S.simonPhase = "dead";
        S.scores.simon = 0;
        S.simonClosed = true;
        tone(100, 0.16, "sawtooth", 0.05);
        showRecap("simon");
        return;
      }
      S.simonInput += 1;
      const note = document.getElementById("simonNote");
      if (note) note.textContent = S.simonInput + " / 6";
      if (S.simonInput >= 6) {
        S.scores.simon = 15;
        S.simonClosed = true;
        S.simonPhase = "clear";
        tone(990, 0.12, "sine", 0.05);
        showRecap("simon");
      }
    }

    function startMatrix() {
      const pool = [...Array(16).keys()];
      for (let i = pool.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        const tmp = pool[i];
        pool[i] = pool[j];
        pool[j] = tmp;
      }
      S.matrixOn = pool.slice(0, 6);
      S.matrixSalt = (Math.random() * 1e9) | 0;
      S.matrixPick = [];
      S.matrixPhase = "show";
      S.matrixUntil = Infinity;
      S.lock = false;
      S.screen = "matrix";
      paint();
      requestAnimationFrame(() => {
        S.matrixUntil = performance.now() + 1500;
      });
    }

    function toggleCell(i) {
      if (S.matrixPhase !== "pick") return;
      const at = S.matrixPick.indexOf(i);
      if (at >= 0) S.matrixPick.splice(at, 1);
      else if (S.matrixPick.length < 6) S.matrixPick.push(i);
      else return;
      document.querySelectorAll("[data-cell]").forEach((el) => {
        el.classList.toggle("on", S.matrixPick.includes(Number(el.getAttribute("data-cell"))));
      });
      const c = document.getElementById("pickCount");
      if (c) c.textContent = S.matrixPick.length + " / 6";
      const btn = document.getElementById("confirm");
      if (btn) btn.disabled = S.matrixPick.length !== 6;
    }

    function confirmMatrix() {
      if (S.matrixPhase !== "pick" || S.matrixPick.length !== 6) return;
      const set = new Set(S.matrixOn);
      S.matrixCorrect = S.matrixPick.filter((i) => set.has(i)).length;
      S.scores.matrix = S.matrixCorrect * 2 + (S.matrixCorrect === 6 ? 3 : 0);
      S.matrixClosed = true;
      S.matrixPhase = "done";
      tone(S.matrixCorrect === 6 ? 990 : 360, 0.1, "sine", 0.05);
      showRecap("matrix");
    }

    function showRecapContinue() {
      const kind = S.recapKind;
      if (kind === "matrix") {
        finish();
        return;
      }
      S.readyKind = { quiz: "balloons", balloons: "bridge", bridge: "simon", simon: "matrix" }[kind];
      S.screen = "ready";
      paint();
    }

    function showRecap(kind) {
      S.recapKind = kind;
      S.screen = "recap";
      S.lock = false;
      paint();
      flourish(kind);
    }

    function flourish(kind) {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const look = {
        quiz: { colors: ["#c44762", "#f5c56b", "#fff6ea", "#8d4538"], shapes: ["square"], n: 130 },
        balloons: { colors: ["#f3a0b5", "#7fa37a", "#2f6f6a", "#e2b656", "#9b2d45"], shapes: ["circle"], n: 150 },
        bridge: { colors: ["#e7c56b", "#d7ece4", "#c44762", "#8a6428"], shapes: ["square"], n: 120 },
        simon: { colors: ["#ff5a7a", "#f5c56b", "#22d3ee", "#3ee0b0"], shapes: ["circle"], n: 130 },
        matrix: { colors: ["#8d4538", "#f5c56b", "#2fbf71", "#c44762"], shapes: ["square"], n: 120 }
      }[kind] || { colors: ["#c44762", "#f5c56b"], shapes: ["circle"], n: 80 };
      const burst = () => {
        if (typeof window.confetti !== "function") return;
        const fire = (x, y, n) => window.confetti({
          particleCount: n,
          spread: 86,
          startVelocity: 38,
          origin: { x, y },
          colors: look.colors,
          shapes: look.shapes,
          scalar: 1.05,
          disableForReducedMotion: true
        });
        fire(0.5, 0.42, look.n);
        setTimeout(() => fire(0.16, 0.62, Math.round(look.n * 0.6)), 260);
        setTimeout(() => fire(0.84, 0.58, Math.round(look.n * 0.6)), 520);
      };
      if (typeof window.confetti === "function") burst();
      else {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js";
        s.onload = burst;
        document.head.appendChild(s);
      }
    }

    function finish() {
      S.running = false;
      S.simonToken++;
      clearBalloons();
      S.screen = "final";
      paint();
      if (total() >= WIN && !celebrated) {
        celebrated = true;
        celebrate();
      }
    }

    function celebrate() {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const run = () => {
        if (typeof window.confetti !== "function") return;
        const colors = ["#22d3ee", "#ff5a7a", "#f5c56b", "#3ee0b0", "#f4f7fb"];
        const fire = (x) => window.confetti({
          particleCount: 110,
          spread: 78,
          startVelocity: 46,
          origin: { x, y: 0.62 },
          colors,
          disableForReducedMotion: true
        });
        fire(0.5);
        const t0 = performance.now();
        let left = false;
        let right = false;
        const more = (now) => {
          const dt = now - t0;
          if (!left && dt > 380) { left = true; fire(0.18); }
          if (!right && dt > 760) { right = true; fire(0.82); }
          if (dt < 1100) requestAnimationFrame(more);
        };
        requestAnimationFrame(more);
      };
      if (typeof window.confetti === "function") run();
      else {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js";
        s.onload = run;
        document.head.appendChild(s);
      }
    }

    function hardReset() {
      const veil = document.getElementById("veil");
      if (!veil || veil.classList.contains("on") || S.resetting) return;
      S.resetting = true;
      S.running = false;
      S.epoch += 1;
      S.simonToken += 1;
      clearBalloons();
      document.getElementById("veilLine").textContent = CHEERS[(Math.random() * CHEERS.length) | 0];
      veil.hidden = false;
      requestAnimationFrame(() => veil.classList.add("on"));
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      setTimeout(() => {
        celebrated = false;
        const mute = S.mute;
        const epoch = S.epoch;
        const token = S.simonToken;
        const next = fresh();
        next.mute = mute;
        next.epoch = epoch;
        next.simonToken = token;
        Object.keys(S).forEach((k) => delete S[k]);
        Object.assign(S, next);
        paint();
        veil.classList.remove("on");
        setTimeout(() => { veil.hidden = true; }, reduce ? 0 : 360);
      }, reduce ? 240 : 1500);
    }

    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn || btn.disabled) return;
      const act = btn.dataset.act;
      if (act === "open") {
        S.cardOpen = true;
        const book = document.querySelector(".book");
        if (book) book.classList.add("open");
      } else if (act === "start") begin();
      else if (act === "answer") answer(Number(btn.dataset.i));
      else if (act === "go") goReady();
      else if (act === "side") chooseBridge(btn.dataset.side);
      else if (act === "next") nextFrom(btn.dataset.next);
      else if (act === "pad") pressSimon(Number(btn.dataset.pad));
      else if (act === "cell") toggleCell(Number(btn.dataset.cell));
      else if (act === "confirm") confirmMatrix();
      else if (act === "finish") finish();
      else if (act === "continue") showRecapContinue();
      else if (act === "reset") hardReset();
    });

    document.getElementById("stage").addEventListener("pointerdown", (e) => {
      const bal = e.target.closest?.(".bal");
      if (!bal) return;
      e.preventDefault();
      ensureAudio();
      popBalloon(bal);
    }, { passive: false });

    document.getElementById("mute").addEventListener("click", () => {
      S.mute = !S.mute;
      const btn = document.getElementById("mute");
      btn.setAttribute("aria-pressed", String(S.mute));
      btn.setAttribute("aria-label", S.mute ? "Attiva audio" : "Disattiva audio");
      btn.innerHTML = S.mute
        ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10v4h4l5 4V6L8 10H4z" fill="currentColor" stroke="none"/><path d="M17 10l5 5M22 10l-5 5" stroke-linecap="round"/></svg>'
        : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10v4h4l5 4V6L8 10H4z" fill="currentColor" stroke="none"/><path d="M16 9.5a4 4 0 010 5" stroke-linecap="round"/></svg>';
    });

    document.addEventListener("pointerdown", () => ensureAudio(), { once: true });

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.034, (now - last) / 1000);
      last = now;
      if (S.screen === "balloons" && S.running) stepBalloons(dt);
      if (S.screen === "bridge" && S.bridgePhase === "preview") {
        if (now >= S.bridgePreviewUntil) {
          S.bridgePhase = "input";
          document.querySelectorAll(".pane.lit").forEach((el) => el.classList.remove("lit"));
          document.querySelectorAll('.pane[data-step="0"]').forEach((el) => {
            el.disabled = false;
            el.classList.add("current");
          });
          const cd = document.getElementById("countDown");
          if (cd) cd.textContent = "1 / 8";
          const hint = document.getElementById("bridgeHint");
          if (hint) hint.textContent = "Tocca la lastra su cui mettere il piede.";
          placeWalkerOn(document.getElementById("lip"));
        } else {
          const node = document.getElementById("countDown");
          if (node && S.bridgePreviewUntil < Infinity) {
            node.textContent = Math.max(0, (S.bridgePreviewUntil - now) / 1000).toFixed(1);
          }
        }
      }
      if (S.screen === "matrix" && S.matrixPhase === "show") {
        if (now >= S.matrixUntil) {
          S.matrixPhase = "pick";
          paint();
        } else {
          const node = document.getElementById("countDown");
          if (node && S.matrixUntil < Infinity) {
            node.textContent = Math.max(0, (S.matrixUntil - now) / 1000).toFixed(1);
          }
        }
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    paint();
  </script>
</body>
</html>
